name: Strict CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install ruff
      - name: Check Formatting
        run: ruff format --check midwicket tests
      - name: Lint Codebase
        run: ruff check midwicket tests

  typecheck:
    name: Static Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy
      - name: Run Mypy
        run: mypy midwicket --ignore-missing-imports

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit pip-audit
      - name: Run Bandit
        run: bandit -r midwicket -ll
      - name: Run Pip-Audit
        run: pip-audit -r requirements.txt --desc

  test:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MIDWICKET_ENV: testing
      MIDWICKET_API_KEY_REQUIRED: "false"
      MIDWICKET_DATA_DIR: /tmp/midwicket_test_data
      MIDWICKET_SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov coverage fastapi uvicorn httpx
      - name: Run Tests
        run: |
          pytest tests/ -v \
            --cov=midwicket \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
