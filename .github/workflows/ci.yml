name: CI

# Path-aware, tiered CI.
#
#   docs only        -> no-op pass (skip the heavy gauntlet)
#   tests only       -> pytest only, single Python version
#   subsystem source -> static analysis + full tests (single version)
#   core/deps/config -> complete CI: lint + mypy + bandit + pip-audit
#                       + tests across the full Python matrix
#   workflow_dispatch -> forces the complete CI (manual "when in doubt" path)
#
# The `ci-gate` job is the single aggregated status check intended for branch
# protection: it passes when every job that actually ran succeeded, and treats
# intentionally-skipped tiers as acceptable.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      include_integration:
        description: "Also run integration-marked tests (slower, may need data)"
        type: boolean
        default: false

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYPITCH_ENV: testing
  PYPITCH_API_KEY_REQUIRED: "false"
  PYPITCH_DATA_DIR: /tmp/pypitch_test_data
  PYPITCH_SECRET_KEY: ci-test-secret-key-not-for-production

jobs:
  # --------------------------------------------------------------------------
  # Tier selection: classify the changed paths and decide which jobs to run.
  # --------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.detect.outputs.full }}
      subsystem: ${{ steps.detect.outputs.subsystem }}
      tests_only: ${{ steps.detect.outputs.tests_only }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      run_static: ${{ steps.detect.outputs.run_static }}
      run_tests: ${{ steps.detect.outputs.run_tests }}
      run_audit: ${{ steps.detect.outputs.run_audit }}
      python_matrix: ${{ steps.detect.outputs.python_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect changed paths and select CI tier
        id: detect
        run: |
          set -euo pipefail

          # Manual dispatch always runs the complete CI.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: forcing complete CI."
            {
              echo "full=true"
              echo "subsystem=false"
              echo "tests_only=false"
              echo "docs_only=false"
              echo "run_static=true"
              echo "run_tests=true"
              echo "run_audit=true"
              echo 'python_matrix=["3.9","3.11","3.12"]'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pick the base commit to diff against.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # Fall back to the whole tree when the base is missing or unknown
          # (first push, force-push, shallow history, etc.) -> safest is full CI.
          if [ -z "${BASE}" ] \
             || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Base ref unavailable; treating all tracked files as changed."
            CHANGED="$(git ls-files)"
          else
            CHANGED="$(git diff --name-only "${BASE}" "${{ github.sha }}")"
          fi

          echo "Changed files:"
          echo "${CHANGED}"

          match() { echo "${CHANGED}" | grep -Eq "$1"; }

          deps=false; core=false; src_changed=false; tests=false; docs=false

          # Dependency / config / CI changes -> complete CI.
          if match '^(requirements.*\.txt|pyproject\.toml|mypy\.ini|pytest\.ini|setup\.py|setup\.cfg|\.github/workflows/.*)$'; then
            deps=true
          fi

          # Core engine -> complete CI.
          if match '^pypitch/(core|storage|runtime|compute|query)/' \
             || match '^pypitch/(config|exceptions|__init__|features|logging_config)\.py$'; then
            core=true
          fi

          # Any Python source under pypitch/.
          if echo "${CHANGED}" | grep -Eq '^pypitch/.*\.py$'; then
            src_changed=true
          fi

          if match '^tests/'; then tests=true; fi
          if match '(^|/)[^/]+\.md$' || match '^docs/' || match '^pypitch/docs/'; then docs=true; fi

          # ---- Tier decision -------------------------------------------------
          full=false
          if [ "${deps}" = true ] || [ "${core}" = true ]; then full=true; fi

          tests_only=false
          if [ "${tests}" = true ] && [ "${src_changed}" = false ] && [ "${deps}" = false ]; then
            tests_only=true
          fi

          docs_only=false
          if [ "${docs}" = true ] && [ "${src_changed}" = false ] && [ "${tests}" = false ] && [ "${deps}" = false ]; then
            docs_only=true
          fi

          subsystem=false
          if [ "${src_changed}" = true ] && [ "${full}" = false ]; then subsystem=true; fi

          run_static=false
          run_tests=false
          run_audit=false

          if [ "${full}" = true ]; then
            run_static=true; run_tests=true; run_audit=true
          elif [ "${subsystem}" = true ]; then
            run_static=true; run_tests=true; run_audit=false
          elif [ "${tests_only}" = true ]; then
            run_tests=true
          elif [ "${docs_only}" = true ]; then
            : # docs-only: nothing heavy
          else
            # Unknown / empty change set -> be safe and run the complete CI.
            full=true; run_static=true; run_tests=true; run_audit=true
          fi

          if [ "${full}" = true ]; then
            matrix='["3.9","3.11","3.12"]'
          else
            matrix='["3.11"]'
          fi

          {
            echo "full=${full}"
            echo "subsystem=${subsystem}"
            echo "tests_only=${tests_only}"
            echo "docs_only=${docs_only}"
            echo "run_static=${run_static}"
            echo "run_tests=${run_tests}"
            echo "run_audit=${run_audit}"
            echo "python_matrix=${matrix}"
          } >> "$GITHUB_OUTPUT"

          echo "Tier -> full=${full} subsystem=${subsystem} tests_only=${tests_only} docs_only=${docs_only}"

  # --------------------------------------------------------------------------
  # Static analysis: lint (ruff critical errors) + security (bandit) + types.
  # Runs for subsystem and complete tiers; skipped for tests-only / docs-only.
  # --------------------------------------------------------------------------
  static:
    needs: changes
    if: needs.changes.outputs.run_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -r requirements-lock.txt
          else
            pip install -r requirements.txt
          fi
          pip install -r requirements-dev.txt
          pip install fastapi uvicorn httpx
          pip install ruff bandit mypy

      - name: Lint — ruff (critical errors, blocking)
        run: |
          # Real-bug checks: syntax errors, undefined names, f-string bugs,
          # broken comparisons. These must always pass.
          ruff check pypitch/ tests/ --select E9,F63,F7,F82

      - name: Lint — ruff (style, informational)
        run: ruff check pypitch/ || true

      - name: Security — bandit
        run: bandit -r pypitch/ -ll -x pypitch/sources/retrosheet_adapter.py

      - name: Type check — mypy
        run: mypy pypitch/ --ignore-missing-imports

  # --------------------------------------------------------------------------
  # Dependency vulnerability audit. Complete tier (and manual) only.
  # --------------------------------------------------------------------------
  deps-audit:
    needs: changes
    if: needs.changes.outputs.run_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit — pip-audit (blocks on any known vulnerability)
        run: pip-audit -r requirements.txt --desc

  # --------------------------------------------------------------------------
  # Test suite. Matrix is the full Python set for the complete tier, single
  # version otherwise. Runs for tests-only, subsystem, and complete tiers.
  # --------------------------------------------------------------------------
  tests:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.changes.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -r requirements-lock.txt
          else
            pip install -r requirements.txt
          fi
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov coverage
          pip install fastapi uvicorn httpx

      - name: Run tests with coverage
        run: |
          # Command-line -m overrides the -m in pytest.ini's addopts, so we
          # restate the full exclusion. Performance benchmarks stay excluded
          # everywhere; integration is opt-in via the manual dispatch input.
          MARKERS='not performance and not integration'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.include_integration }}" = "true" ]; then
            MARKERS='not performance'
          fi
          pytest tests/ -v --strict-markers --strict-config \
            --cov=pypitch --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70 -m "${MARKERS}"

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: coverage-report
          path: coverage.xml

  # --------------------------------------------------------------------------
  # Docs-only changes: explicit fast pass so the PR has a green check.
  # --------------------------------------------------------------------------
  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Docs-only change detected — skipping lint, type, security, and test tiers."

  # --------------------------------------------------------------------------
  # Single aggregated gate for branch protection. Passes when every job that
  # actually ran succeeded; intentionally-skipped tiers are acceptable.
  # --------------------------------------------------------------------------
  ci-gate:
    if: always()
    needs: [changes, static, deps-audit, tests, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify executed jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS_JSON}"
          echo "${NEEDS_JSON}" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          bad = [name for name, info in data.items() if info.get("result") in ("failure", "cancelled")]
          if bad:
              print("CI gate failed — these jobs failed or were cancelled:", ", ".join(bad))
              sys.exit(1)
          print("CI gate passed. Executed jobs all green; skipped tiers are acceptable.")
          '
