name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIDWICKET_ENV: testing
  MIDWICKET_API_KEY_REQUIRED: "false"
  MIDWICKET_SECRET_KEY: ci-test-secret-key-not-for-production
  MIDWICKET_DATA_DIR: /tmp/midwicket_test_data

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # GATING: the cheap check that would have caught the breakage that shipped to
  # main (half-committed imports, `await` in sync defs). Every module must
  # byte-compile, the package must import, and every test must be importable.
  # ──────────────────────────────────────────────────────────────────────────
  build-import:
    name: Build / import / collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime + serve deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-serve.txt
          pip install pytest
      - name: Byte-compile every source file
        run: python -m compileall -q midwicket
      - name: Import the package
        run: python -c "import midwicket; print('import OK', midwicket.__version__)"
      - name: Every test module must import (collect-only)
        run: pytest --collect-only -q

  # ──────────────────────────────────────────────────────────────────────────
  # GATING: full test suite + coverage floor. Known bugs are tracked as an
  # xfail backlog in tests/conftest.py (KNOWN_FAILURES) and burned down per PR;
  # an xpass there will show up so we know when a fix has actually landed.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Tests + coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-serve.txt
          pip install pytest pytest-cov coverage scikit-learn matplotlib reportlab fakeredis
      - name: Run test suite with coverage
        # pytest.ini already excludes performance/integration markers.
        run: |
          pytest \
            --cov=midwicket \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=65
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # GATING: exercises the REAL pipeline (canonicalize -> ingest -> query) using
  # only core deps (no serve extras), so it also proves the library works
  # without FastAPI installed.
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: End-to-end smoke (core deps only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime deps only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run e2e smoke test
        run: pytest tests/test_e2e_smoke.py -q

  # ──────────────────────────────────────────────────────────────────────────
  # GATING: repo hygiene. Fails if the scratch-script rot (or merge markers, or
  # committed binaries) ever comes back. This is enforcement of MW-029/030/031.
  # ──────────────────────────────────────────────────────────────────────────
  hygiene:
    name: Repo hygiene guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No agent scratch scripts / forbidden artifacts
        run: |
          set -e
          fail=0
          # Root-level scratch patchers that historically corrupted the code.
          if ls fix_*.py update_audit*.py add_middleware*.py callback.py validate_production.py 2>/dev/null | grep -q .; then
            echo "::error::Scratch/patcher scripts found at repo root (MW-029)."; fail=1
          fi
          # Duplicate/tombstone tests and stray dumps at the repo root.
          for f in v1.txt test_duck.py test_redis.py; do
            [ -e "$f" ] && { echo "::error::Forbidden root file: $f"; fail=1; }
          done
          # Tracked binaries that must never be committed.
          if git ls-files '*.pdf' '*.xlsx' '*.docx' '*.pptx' | grep -q .; then
            echo "::error::Binary artifact tracked in git (see .gitignore)."; fail=1
          fi
          # The dead pypitch/ namespace must stay gone.
          if [ -d pypitch ]; then echo "::error::pypitch/ ghost directory is back."; fail=1; fi
          # Unresolved merge-conflict markers.
          if git grep -nE '^(<<<<<<<|>>>>>>>|=======)$' -- '*.py' >/dev/null 2>&1; then
            echo "::error::Merge-conflict markers present."; fail=1
          fi
          exit $fail

  # ──────────────────────────────────────────────────────────────────────────
  # ADVISORY (not yet gating): the codebase currently has ~150 ruff and ~70 mypy
  # findings. These run for visibility and trend tracking; they flip to REQUIRED
  # once the lint/type-cleanup PR lands. (Do not delete — make them gating.)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff check
        run: ruff check midwicket tests || true
      - name: ruff format --check
        run: ruff format --check midwicket tests || true

  typecheck:
    name: Type check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install mypy
          pip install -r requirements.txt
      - run: mypy midwicket --ignore-missing-imports || true

  security:
    name: Security audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit pip-audit
      - name: Bandit (high severity)
        run: bandit -r midwicket -lll
      - name: pip-audit
        run: pip-audit -r requirements.txt --desc || true
