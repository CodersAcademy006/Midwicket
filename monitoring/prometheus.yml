# Minimal Prometheus configuration for Midwicket
# Extend this file as your monitoring needs grow.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "midwicket-api"
    static_configs:
      - targets: ["midwicket-api:8000"]
    metrics_path: /metrics
    # If API key auth is enabled, set bearer_token to one key listed in MIDWICKET_API_KEYS.
    # bearer_token: "replace-with-one-api-key"
